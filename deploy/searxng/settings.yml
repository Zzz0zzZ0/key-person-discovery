use_default_settings:
  engines:
    keep_only:
      - bing
      - baidu
      - duckduckgo web
      - google cse
      - naver
      - qwant
      - yandex

engines:
  - name: bing
    # 2026-09-11: direct and SearXNG probes returned unrelated results.
    disabled: true
  - name: baidu
    disabled: true
  - name: duckduckgo web
    disabled: true
  - name: google cse
    disabled: false
    network:
      retries: 0
  - name: naver
    disabled: true
  - name: qwant
    disabled: true
    network:
      retries: 2
  - name: yandex
    disabled: true

general:
  debug: false
  instance_name: Key Person Search

search:
  safe_search: 0
  formats:
    - html
    - json

outgoing:
  request_timeout: 25.0
  max_request_timeout: 45.0
  extra_proxy_timeout: 10
  proxies:
    all://:
      - http://host.docker.internal:7897

server:
  bind_address: 0.0.0.0
  port: 8080
  secret_key: change-me
  limiter: false
  image_proxy: false
