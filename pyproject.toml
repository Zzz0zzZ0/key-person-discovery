[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "key-person-discovery"
version = "0.4.0"
description = "Public-web key person discovery for Twenty CRM companies"
requires-python = ">=3.11"
dependencies = [
  "crawl4ai>=0.9,<0.10",
  "fastapi>=0.116,<1",
  "phonenumbers>=9,<10",
  "pypdf>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
key-person-discovery = "key_person_discovery.cli:main"
key-person-dashboard = "key_person_discovery.dashboard:main"
key-person-batch = "key_person_discovery.batch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
